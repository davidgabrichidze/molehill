# Pushing a version tag (v0.2.0) publishes a GitHub Release with the
# installer and its SHA-256. The app's self-update looks for exactly these
# two files on the latest release:
#   molehill-setup-<version>.exe
#   molehill-setup-<version>.exe.sha256
# and also uploads molehill-setup.exe, a copy with a fixed name, so
# /releases/latest/download/molehill-setup.exe is a permanent download link.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match the Cargo version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $cargo = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'molehill' | Select-Object -ExpandProperty version
          if ($tag -ne $cargo) { throw "Tag v$tag doesn't match the workspace version $cargo in Cargo.toml" }
          "version=$tag" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace --locked

      - name: Release build
        run: cargo build --release --workspace --locked

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer\molehill.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          $exe = "installer\Output\molehill-setup-${{ steps.version.outputs.version }}.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  molehill-setup-${{ steps.version.outputs.version }}.exe" | Set-Content -NoNewline -Encoding ascii "$exe.sha256"
          # The same installer under a fixed name: /releases/latest/download/molehill-setup.exe
          # then always serves the newest one (the website links it). The app's
          # updater only looks at the versioned file and its checksum.
          Copy-Item $exe "installer\Output\molehill-setup.exe"

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          gh release create "${{ github.ref_name }}" `
            "installer\Output\molehill-setup-$v.exe" `
            "installer\Output\molehill-setup-$v.exe.sha256" `
            "installer\Output\molehill-setup.exe" `
            --title "Molehill $v" `
            --generate-notes `
            --verify-tag

  # macOS: one .pkg per architecture, added to the release made above:
  #   Molehill-<version>-<arch>.pkg and .sha256 (what the app's updater
  #   looks for), and Molehill-<arch>.pkg under a fixed name for
  #   /releases/latest/download/Molehill-<arch>.pkg.
  macos:
    name: macOS (${{ matrix.arch }})
    needs: release
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace --locked

      - name: Release build
        run: cargo build --release --workspace --locked --target ${{ matrix.target }}

      - name: Engines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A bundle pinned by engines.yml, if engines.lock names one;
          # otherwise bundled from Homebrew now.
          tag=$(grep -v '^#' packaging/macos/engines.lock 2>/dev/null | head -n 1 || true)
          if [ -n "$tag" ]; then
            gh release download "$tag" --pattern "$tag-${{ matrix.arch }}.tar.gz" --dir dist
            mkdir -p dist/engines && tar -xzf "dist/$tag-${{ matrix.arch }}.tar.gz" -C dist/engines
          else
            packaging/macos/bundle-engines.sh dist/engines
          fi

      - name: Package
        run: |
          packaging/macos/make-app.sh ${{ matrix.target }} dist
          pkg=$(packaging/macos/build-pkg.sh ${{ matrix.target }} dist/engines dist)
          cp "$pkg" "dist/Molehill-${{ matrix.arch }}.pkg"

      - name: Engine sources (GPL / LGPL)
        if: matrix.arch == 'arm64'
        run: packaging/macos/engine-sources.sh "dist/molehill-engine-sources-${GITHUB_REF_NAME#v}.tar"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "dist/Molehill-$v-${{ matrix.arch }}.pkg" \
            "dist/Molehill-$v-${{ matrix.arch }}.pkg.sha256" \
            "dist/Molehill-${{ matrix.arch }}.pkg" \
            $(ls dist/molehill-engine-sources-*.tar 2>/dev/null)
